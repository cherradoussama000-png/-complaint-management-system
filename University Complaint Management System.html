<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>University Complaint Management</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#667085;--bd:#e3e7ef;--pri:#2b4bd6;--priTx:#fff;--side:#14213d;--new:#e8efff;--newT:#2b4bd6;--prog:#fff3d6;--progT:#8a5a00;--done:#dcf5e5;--doneT:#1c7a43;--err:#c43030;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2e;--tx:#e8ecf5;--mut:#9aa5bb;--bd:#27314a;--pri:#6f8bff;--priTx:#0b1020;--side:#0a0f1c;--new:#1d2a55;--newT:#9fb3ff;--prog:#3a2f10;--progT:#f1c565;--done:#12301f;--doneT:#7fdca3;--err:#ff7d7d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2e;--tx:#e8ecf5;--mut:#9aa5bb;--bd:#27314a;--pri:#6f8bff;--priTx:#0b1020;--side:#0a0f1c;--new:#1d2a55;--newT:#9fb3ff;--prog:#3a2f10;--progT:#f1c565;--done:#12301f;--doneT:#7fdca3;--err:#ff7d7d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh}
aside{width:220px;background:var(--side);color:#fff;padding:20px 14px;flex-shrink:0}
aside h1{font-size:15px;margin:0 0 20px;line-height:1.3}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:#cdd5e8;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:4px}
aside button.on,aside button:hover{background:rgba(255,255,255,.12);color:#fff}
main{flex:1;padding:28px;max-width:1000px;min-width:0}
h2{margin:0 0 18px;font-size:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:120px;resize:vertical}
.err{color:var(--err);font-size:13px;margin-top:4px;min-height:0}
.btn{background:var(--pri);color:var(--priTx);border:0;padding:10px 18px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.stat b{font-size:24px;display:block}.stat span{color:var(--mut);font-size:13px}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.tools input,.tools select{flex:1;min-width:160px;width:auto}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);font-size:14px}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.b{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b.New{background:var(--new);color:var(--newT)}.b.In-Progress{background:var(--prog);color:var(--progT)}.b.Processed{background:var(--done);color:var(--doneT)}
.ok{text-align:center;padding:30px 10px}.ok .id{font-size:28px;font-weight:700;color:var(--pri);margin:10px 0 20px}
dl{display:grid;grid-template-columns:140px 1fr;gap:10px 14px;margin:0 0 20px}dt{color:var(--mut)}dd{margin:0;white-space:pre-wrap}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.lock{background:var(--done);color:var(--doneT);padding:12px 14px;border-radius:8px;margin-bottom:12px;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:24px}
@media(max-width:700px){body{flex-direction:column}aside{width:100%;padding:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}aside h1{width:100%;margin:0 0 4px}aside button{width:auto;margin:0}main{padding:16px}.stats{grid-template-columns:1fr 1fr}dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:8px}}
</style>
</head>
<body>
<aside>
  <h1>University Complaint<br>Management</h1>
  <button id="nS">Student: Submit Complaint</button>
  <button id="nA">Administrator: Dashboard</button>
</aside>
<main id="app"></main>
<script>
const KEY="ucms_complaints_v1", CATS=["Grades","Registration","Timetable"], STS=["New","In Progress","Processed"];
const demo=[
{id:1001,studentName:"Amine Benali",category:"Grades",subject:"Incorrect exam grade",description:"My Algorithms exam grade does not match the paper I reviewed.",submissionDate:"2026-10-28",status:"New"},
{id:1002,studentName:"Sara Messaoud",category:"Registration",subject:"Missing course in my record",description:"The Databases module does not appear in my registration list.",submissionDate:"2026-10-30",status:"In Progress"},
{id:1003,studentName:"Yacine Haddad",category:"Timetable",subject:"Room conflict on Tuesday",description:"Two lectures are scheduled in the same slot for group 3.",submissionDate:"2026-10-25",status:"Processed"},
{id:1004,studentName:"Lina Boukhalfa",category:"Grades",subject:"Missing project mark",description:"My Software Engineering project mark is blank in the portal.",submissionDate:"2026-11-01",status:"New"}];
let list=load(), view="student", sel=null, q="", flt="All", done=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return demo.map(x=>({...x}))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(list))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const badge=s=>`<span class="b ${s.replace(" ","-")}">${s}</span>`;
const $=id=>document.getElementById(id);
function go(v){view=v;sel=null;done=null;history.replaceState(null,"","#"+(v==="student"?"student":"admin"));render()}
$("nS").onclick=()=>go("student");$("nA").onclick=()=>go("admin");

function render(){
  $("nS").classList.toggle("on",view==="student");$("nA").classList.toggle("on",view!=="student");
  const a=$("app");
  if(view==="student")return done?renderOk(a):renderForm(a);
  if(sel!==null)return renderDetails(a);
  renderDash(a);
}
function renderForm(a,v={}){
  a.innerHTML=`<h2>Submit a Complaint</h2><div class="card"><div>
  <label for="f1">Student Name</label><input id="f1" value="${esc(v.n||"")}"><div class="err" id="e1"></div>
  <label for="f2">Category</label><select id="f2"><option value="">Select a category</option>${CATS.map(c=>`<option ${v.c===c?"selected":""}>${c}</option>`).join("")}</select><div class="err" id="e2"></div>
  <label for="f3">Subject</label><input id="f3" value="${esc(v.s||"")}"><div class="err" id="e3"></div>
  <label for="f4">Description</label><textarea id="f4">${esc(v.d||"")}</textarea><div class="err" id="e4"></div>
  <p style="margin-top:18px"><button class="btn" id="sub">Submit Complaint</button></p></div></div>`;
  $("sub").onclick=()=>{
    const n=$("f1").value.trim(),c=$("f2").value,s=$("f3").value.trim(),d=$("f4").value.trim();
    const m={e1:n?"":"Student name is required.",e2:c?"":"Please select a category.",e3:s?"":"Subject is required.",e4:d?"":"Description is required."};
    for(const k in m)$(k).textContent=m[k];
    if(Object.values(m).some(Boolean))return;
    const id=list.reduce((x,y)=>Math.max(x,y.id),1000)+1;
    list.push({id,studentName:n,category:c,subject:s,description:d,submissionDate:new Date().toISOString().slice(0,10),status:"New"});
    save();done=id;render();
  };
}
function renderOk(a){
  a.innerHTML=`<h2>Submit a Complaint</h2><div class="card ok"><div style="font-size:40px">✅</div><h3 style="margin:6px 0">Complaint submitted successfully</h3><div class="id">Complaint ID: #${done}</div><button class="btn" id="back">Submit another complaint</button></div>`;
  $("back").onclick=()=>{done=null;render()};
}
function renderDash(a){
  const cnt=s=>list.filter(c=>c.status===s).length;
  a.innerHTML=`<h2>Dashboard</h2>
  <div class="stats"><div class="stat"><b>${list.length}</b><span>Total</span></div><div class="stat"><b>${cnt("New")}</b><span>New</span></div><div class="stat"><b>${cnt("In Progress")}</b><span>In Progress</span></div><div class="stat"><b>${cnt("Processed")}</b><span>Processed</span></div></div>
  <div class="tools"><input id="q" placeholder="Search by complaint ID (e.g. 1001)" inputmode="numeric" value="${esc(q)}" aria-label="Search by ID">
  <select id="fl" aria-label="Filter by status"><option>All</option>${STS.map(s=>`<option ${flt===s?"selected":""}>${s}</option>`).join("")}</select></div>
  <div class="card tw" style="padding:0"><table><thead><tr><th>ID</th><th>Student</th><th>Category</th><th>Subject</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  $("q").oninput=e=>{q=e.target.value;rows()};$("fl").onchange=e=>{flt=e.target.value;rows()};
  rows();
}
function rows(){
  const t=q.trim().replace("#","");
  const r=list.filter(c=>(flt==="All"||c.status===flt)&&(!t||String(c.id).includes(t))).sort((x,y)=>y.id-x.id);
  $("tb").innerHTML=r.length?r.map(c=>`<tr><td>#${c.id}</td><td>${esc(c.studentName)}</td><td>${c.category}</td><td>${esc(c.subject)}</td><td>${c.submissionDate}</td><td>${badge(c.status)}</td><td><button class="btn sec" data-id="${c.id}">View</button></td></tr>`).join(""):`<tr><td colspan="7" class="empty">No complaints match your search.</td></tr>`;
  $("tb").querySelectorAll("button").forEach(b=>b.onclick=()=>{sel=+b.dataset.id;render()});
}
function renderDetails(a){
  const c=list.find(x=>x.id===sel), lock=c.status==="Processed";
  a.innerHTML=`<h2>Complaint #${c.id}</h2><div class="card">
  <dl><dt>Complaint ID</dt><dd>#${c.id}</dd><dt>Student</dt><dd>${esc(c.studentName)}</dd><dt>Category</dt><dd>${c.category}</dd><dt>Subject</dt><dd>${esc(c.subject)}</dd><dt>Description</dt><dd>${esc(c.description)}</dd><dt>Submission date</dt><dd>${c.submissionDate}</dd><dt>Current status</dt><dd>${badge(c.status)}</dd></dl>
  ${lock?`<div class="lock">This complaint has been processed and can no longer be modified.</div>`:""}
  <label>Change status</label><div class="seg">${STS.map(s=>`<button class="btn ${c.status===s?"":"sec"}" data-s="${s}" ${lock?"disabled":""}>${s}</button>`).join("")}</div>
  <p style="margin-top:20px"><button class="btn sec" id="bk">← Back to dashboard</button></p></div>`;
  a.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{if(c.status==="Processed")return;c.status=b.dataset.s;save();render()});
  $("bk").onclick=()=>{sel=null;render()};
}
if(location.hash==="#admin")view="admin";
render();
</script>
</body>
</html>
